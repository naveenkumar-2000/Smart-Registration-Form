<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <!-- Tailwind CSS Play CDN -->
  <script src="https://tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    #formPanel{
      box-shadow: 0px 0px 0px 3px #ffffff, 0px 0px 8px #97b7f7 inset;
    }
    #id{
      resize: none;
    }
   
  </style>
</head>
<body style="background:url('./gemini_generated_video_319694c5.mp4')" class=" bg-gray-300 flex justify-center items-center min-height-screen min-h-screen p-5 font-sans">

  <!-- Registration Form Panel -->
  <div id="formPanel" class="bg-[white] p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-gray-800 font-[Black Ops One] text-3xl font-bold mb-6 text-center">Create Account</h2>
    <form id="regForm" novalidate class="space-y-5">
      
      <!-- Name Field -->
      <div class="flex flex-col">
        <label for="username" class="font-[GravitasOne] text-xl font-semibold text-gray-800 mb-1">Full Name</label>
        <input type="text" id="username" placeholder="John Doe" 
              style="box-shadow: 0px 0px 0px 2px #ffffff, 0px 0px 5px #97b7f7 inset;"
               class="w-full px-3 py-2 border border-gray-300 rounded-md text-base text-gray-800 outline-none transition focus:border-indigo-500 focus:ring-3 focus:ring-indigo-500/15">
        <div class="flex justify-between items-start mt-1 min-h-[18px]">
          <span id="nameError" class="text-red-600 text-xs invisible opacity-0 transition-opacity duration-200">Name cannot be empty.</span>
        </div>
      </div>

      <!-- Email Field -->
      <div class="flex flex-col">
        <label for="email" class="font-[GravitasOne] text-xl text-sm font-semibold text-gray-800 mb-1">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" 
              style="box-shadow: 0px 0px 0px 2px #ffffff, 0px 0px 5px #97b7f7 inset;"
              class=" w-full px-3 py-2 border border-gray-300 rounded-md text-base text-gray-800 outline-none transition focus:border-indigo-500 focus:ring-3 focus:ring-indigo-500/15">
        <div class="flex justify-between items-start mt-1 min-h-[18px]">
          <span id="emailError" class="text-red-600 text-xs invisible opacity-0 transition-opacity duration-200">Please enter a valid email address.</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="flex flex-col">
        <label for="password" class="text-sm font-semibold font-[GravitasOne] text-xl text-gray-800 mb-1">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" 
        style="box-shadow: 0px 0px 0px 2px #ffffff, 0px 0px 5px #97b7f7 inset;"
               class="w-full px-3 py-2 border border-gray-300 rounded-md text-base text-gray-800 outline-none transition focus:border-indigo-500 focus:ring-3 focus:ring-indigo-500/15">
        <div class="flex justify-between items-start mt-1 min-h-[18px]">
          <span id="passwordError" class="text-red-600 text-xs invisible opacity-0 transition-opacity duration-200">Password must be at least 6 characters.</span>
        </div>
      </div>

      <!-- Bio Field -->
      <div class="flex flex-col">
        <label for="bio" class="text-sm font-semibold text-gray-800 mb-1 font-[GravitasOne] text-xl">Bio</label>
        <textarea id="bio" maxlength="200" placeholder="Tell us about yourself..." 
        style="box-shadow: 0px 0px 0px 2px #ffffff, 0px 0px 5px #97b7f7 inset; resize: none;" 
                  class="px-3 py-2 border border-gray-300 rounded-md text-base text-gray-800 outline-none resize-y min-h-[100px] transition focus:border-indigo-500 focus:ring-3 focus:ring-indigo-500/15"></textarea>
        <div class="flex justify-between items-start mt-1 min-h-[18px]">
          <span id="bioError" class="text-red-600 text-xs invisible opacity-0 transition-opacity duration-200">Bio is required.</span>
          <span id="charCounter" class="text-gray-500 text-xs whitespace-nowrap ml-auto">0 / 200 characters</span>
        </div>
      </div>

      <button type="submit" id="submitBtn" disabled 
              class="font-[GravitasOne] text-xl w-full py-3 bg-indigo-600 text-white rounded-md text-base font-semibold transition mt-2 hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-70">
        Register
      </button>
    </form>
  </div>

  <!-- Success Message Panel -->
  <div id="successPanel" class="hidden bg-white py-10 px-8 rounded-lg shadow-md w-full max-w-md text-center">
    <h3 class="text-green-600 text-2xl font-bold mb-3">Registration Successful!</h3>
    <p class="text-gray-500 text-base">Your account has been created successfully.</p>
  </div>

  <script src="java.js"></script>
  
</body>
</html>
